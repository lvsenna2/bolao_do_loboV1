name: Football cron

on:
  schedule:
    - cron: "7,37 * * * *"
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Tarefa a executar
        type: choice
        default: both
        options:
          - sync
          - catalog
          - both

permissions:
  id-token: write

# Serialize all invocations; never cancel a request that may already be writing results.
concurrency:
  group: football-production-cron
  cancel-in-progress: false

jobs:
  invoke:
    # Standard runners are free for public repositories. Stop if visibility changes.
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Invoke protected production endpoints
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
          CRON_TARGET: ${{ inputs.target }}
        shell: python
        run: |
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          target = os.environ.get("CRON_TARGET") or (
              "catalog" if os.environ.get("CRON_SCHEDULE") == "17 */6 * * *" else "sync"
          )
          if target not in ("sync", "catalog", "both"):
              sys.exit("Invalid cron target.")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())
          failed = False
          for task in (["sync", "catalog"] if target == "both" else [target]):
              started = time.monotonic()
              try:
                  token_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
                  token_url += "&audience=" + urllib.parse.quote("https://www.simuladorcopa2026.com.br/api/cron", safe="")
                  token_request = urllib.request.Request(token_url, headers={
                      "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
                  })
                  with opener.open(token_request, timeout=30) as response:
                      token = json.load(response)["value"]
                  print("::add-mask::" + token)
                  request = urllib.request.Request(
                      "https://www.simuladorcopa2026.com.br/api/cron/football-" + task,
                      headers={"Authorization": "Bearer " + token, "Accept": "application/json"},
                  )
                  with opener.open(request, timeout=310) as response:
                      result = json.load(response)
                  if not isinstance(result, dict) or result.get("ok") is not True:
                      raise ValueError("Unsuccessful cron response")
                  if result.get("locked"):
                      raise ValueError("Cron was skipped because another execution holds the lock")
                  print(f"{task}: success in {time.monotonic() - started:.1f}s")
              except urllib.error.HTTPError as error:
                  print(f"{task}: HTTP {error.code}", file=sys.stderr)
                  failed = True
              except Exception as error:
                  # Never log response bodies or headers: they can contain private data.
                  print(f"{task}: failed ({type(error).__name__})", file=sys.stderr)
                  failed = True
          sys.exit(1 if failed else 0)
