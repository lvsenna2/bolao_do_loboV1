    <linearGradient id="red" x1="0" x2="1"><stop offset="0" stop-color="#8b0016"/><stop offset="1" stop-color="#e21b32"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop offset="0" stop-color="#063d24"/><stop offset="1" stop-color="#0b7c3d"/></linearGradient>
