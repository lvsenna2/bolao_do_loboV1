<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Flamengo x Cruzeiro - Flamengo se classificar</title>
  <desc id="desc">Banner promocional do Bolao do Lobo. Coloque R$ 10 e volta R$ 25 se o Flamengo se classificar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070707"/>
      <stop offset="0.48" stop-color="#210106"/>
      <stop offset="1" stop-color="#061020"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="1">
      <stop offset="0" stop-color="#8d0011"/>
      <stop offset="1" stop-color="#ef1732"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#072a63"/>
      <stop offset="1" stop-color="#1263c6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#f0a90a"/>
      <stop offset="0.5" stop-color="#ffd35b"/>
      <stop offset="1" stop-color="#cf8500"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="100" cy="260" r="280" fill="#d31327" opacity="0.14"/>
  <circle cx="990" cy="280" r="300" fill="#0a63cf" opacity="0.13"/>
  <path d="M0 220 L1080 40" stroke="#fff" stroke-opacity="0.05" stroke-width="3"/>
  <path d="M0 330 L1080 150" stroke="#fff" stroke-opacity="0.05" stroke-width="3"/>
  <path d="M0 440 L1080 260" stroke="#fff" stroke-opacity="0.05" stroke-width="3"/>

  <g transform="translate(52 42)">
    <rect width="304" height="64" rx="32" fill="#111" stroke="#f2b31f" stroke-width="2"/>
    <text x="152" y="42" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">BOLAO DO LOBO</text>
  </g>

  <text x="540" y="152" text-anchor="middle" fill="#f1b52b" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" letter-spacing="5">LIBERTADORES</text>
  <text x="540" y="193" text-anchor="middle" fill="#d7d7d7" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="4">JOGO DE VOLTA</text>

  <g filter="url(#shadow)">
    <rect x="52" y="236" width="976" height="340" rx="34" fill="#101010" stroke="#f3b525" stroke-opacity="0.48" stroke-width="2"/>
    <path d="M52 270 Q52 236 86 236 H540 V576 H86 Q52 576 52 542 Z" fill="url(#red)"/>
    <path d="M540 236 H994 Q1028 236 1028 270 V542 Q1028 576 994 576 H540 Z" fill="url(#blue)"/>

    <g transform="translate(300 396)">
      <path d="M-78 -94 L78 -94 L62 60 Q0 108 -62 60 Z" fill="#080808" stroke="#fff" stroke-width="6"/>
      <path d="M-58 -62 H58 M-62 -20 H62 M-54 22 H54" stroke="#d80d25" stroke-width="21"/>
      <text x="0" y="150" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="900">FLAMENGO</text>
    </g>

    <g transform="translate(780 396)">
      <circle r="92" fill="#fff" stroke="#1e4c9f" stroke-width="8"/>
      <text x="0" y="-105" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="900">CRUZEIRO</text>
      <g fill="#1353a5">
        <circle cx="0" cy="-34" r="9"/><circle cx="32" cy="-10" r="9"/><circle cx="20" cy="28" r="9"/><circle cx="-20" cy="28" r="9"/><circle cx="-32" cy="-10" r="9"/>
      </g>
      <text x="0" y="150" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="900">CRUZEIRO</text>
    </g>

    <circle cx="540" cy="396" r="54" fill="#0b0b0b" stroke="#f4b622" stroke-width="4"/>
    <text x="540" y="412" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900">X</text>
  </g>

  <text x="540" y="650" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" letter-spacing="1">PROMOCAO ESPECIAL</text>
  <text x="540" y="713" text-anchor="middle" fill="url(#gold)" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="900">FLAMENGO SE CLASSIFICAR</text>

  <g filter="url(#shadow)">
    <rect x="88" y="766" width="904" height="196" rx="32" fill="#0c0c0c" stroke="#f1b11e" stroke-width="3"/>
    <rect x="116" y="794" width="380" height="140" rx="24" fill="#171717" stroke="#6f520c"/>
    <rect x="584" y="794" width="380" height="140" rx="24" fill="#171717" stroke="#6f520c"/>
    <text x="306" y="839" text-anchor="middle" fill="#d0d0d0" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" letter-spacing="3">COLOQUE</text>
    <text x="306" y="907" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="900">R$ 10</text>
    <text x="774" y="839" text-anchor="middle" fill="#d0d0d0" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" letter-spacing="3">VOLTA</text>
    <text x="774" y="907" text-anchor="middle" fill="url(#gold)" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="900">R$ 25</text>
    <text x="540" y="885" text-anchor="middle" fill="#f1b11e" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="900">→</text>
  </g>

  <text x="540" y="1012" text-anchor="middle" fill="#9d9d9d" font-family="Arial,Helvetica,sans-serif" font-size="18">Consulte o regulamento da campanha na plataforma.</text>
</svg>