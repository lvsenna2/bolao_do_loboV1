<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Flamengo x Cruzeiro - jogo de volta da Libertadores</title>
  <desc id="desc">Campanha Bolao do Lobo: Flamengo se classificar. Coloque 10, volta 25.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090909"/>
      <stop offset="0.52" stop-color="#240005"/>
      <stop offset="1" stop-color="#050a17"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c40016"/>
      <stop offset="1" stop-color="#ff2a3d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#003f8f"/>
      <stop offset="1" stop-color="#0f6dd9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="105" cy="180" r="240" fill="#d6001c" opacity=".13"/>
  <circle cx="980" cy="1190" r="300" fill="#0866d9" opacity=".14"/>

  <g opacity=".11" fill="none" stroke="#fff" stroke-width="2">
    <path d="M-100 310 L1180 90"/>
    <path d="M-100 430 L1180 210"/>
    <path d="M-100 550 L1180 330"/>
    <path d="M-100 670 L1180 450"/>
  </g>

  <g transform="translate(74 66)">
    <rect x="0" y="0" width="320" height="68" rx="34" fill="#ffffff" opacity=".96"/>
    <text x="160" y="45" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900" fill="#111">BOLAO DO LOBO</text>
  </g>

  <text x="540" y="208" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" letter-spacing="5" fill="#f2f2f2">LIBERTADORES</text>
  <text x="540" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="4" fill="#b9b9b9">JOGO DE VOLTA</text>

  <g filter="url(#shadow)">
    <rect x="72" y="326" width="936" height="356" rx="42" fill="#111" stroke="#ffffff" stroke-opacity=".13" stroke-width="2"/>
    <path d="M72 368 Q72 326 114 326 H540 V682 H114 Q72 682 72 640 Z" fill="url(#red)" opacity=".92"/>
    <path d="M540 326 H966 Q1008 326 1008 368 V640 Q1008 682 966 682 H540 Z" fill="url(#blue)" opacity=".92"/>

    <text x="308" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="#fff">FLAMENGO</text>
    <text x="772" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="#fff">CRUZEIRO</text>

    <circle cx="308" cy="545" r="58" fill="#0d0d0d" stroke="#fff" stroke-width="7"/>
    <path d="M272 522 H344 M272 545 H344 M272 568 H344" stroke="#d3182d" stroke-width="12"/>

    <circle cx="772" cy="545" r="58" fill="#fff"/>
    <g fill="#0b55a3" transform="translate(772 545)">
      <circle cx="0" cy="-24" r="6"/>
      <circle cx="22" cy="-7" r="6"/>
      <circle cx="14" cy="20" r="6"/>
      <circle cx="-14" cy="20" r="6"/>
      <circle cx="-22" cy="-7" r="6"/>
    </g>

    <circle cx="540" cy="504" r="58" fill="#0b0b0b" stroke="#ffffff" stroke-width="5"/>
    <text x="540" y="522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900" fill="#fff">X</text>
  </g>

  <text x="540" y="790" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="800" letter-spacing="2" fill="#e8e8e8">FLAMENGO SE CLASSIFICAR</text>

  <g filter="url(#shadow)">
    <rect x="116" y="846" width="848" height="270" rx="42" fill="#f7f7f7"/>
    <text x="540" y="925" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#151515">COLOQUE</text>
    <text x="540" y="1016" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="98" font-weight="900" fill="#c40016">R$ 10</text>
    <line x1="260" y1="1051" x2="820" y2="1051" stroke="#d6d6d6" stroke-width="3"/>
    <text x="540" y="1092" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#161616">VOLTA R$ 25</text>
  </g>

  <rect x="200" y="1188" width="680" height="74" rx="37" fill="#d10b21"/>
  <text x="540" y="1237" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" letter-spacing="2" fill="#fff">FAÇA SEU PALPITE</text>

  <text x="540" y="1310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#999">Campanha promocional sujeita às regras da plataforma.</text>
</svg>